name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dscan
            asset_name: dscan-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: dscan
            asset_name: dscan-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dscan.exe
            asset_name: dscan-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mold Linker
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-all-crates: "true"

      - name: Build dscan-cli (Linux x86_64 with Mold)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: mold -run cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Build dscan-cli (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Build dscan-cli (Windows x64)
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.bin_name }}
          cd ../../..
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_name }}
          $hash = (Get-FileHash -Path ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii

      - name: Upload CLI Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  build-gui-linux:
    name: Build Desktop GUI (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux GPUI System Libraries & Mold
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libvulkan-dev mold clang pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: gui-linux-release
          cache-all-crates: "true"

      - name: Build GPUI GUI (with Mold)
        run: |
          mold -run cargo build --release -p dscan-gui
          mkdir -p release-gui
          cp target/release/dscan-gui release-gui/
          tar -czf dscan-gui-linux-x86_64.tar.gz -C release-gui dscan-gui
          sha256sum dscan-gui-linux-x86_64.tar.gz > dscan-gui-linux-x86_64.tar.gz.sha256

      - name: Upload GUI Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dscan-gui-linux-x86_64.tar.gz
          path: |
            dscan-gui-linux-x86_64.tar.gz
            dscan-gui-linux-x86_64.tar.gz.sha256

  build-gui-windows:
    name: Build Desktop GUI (Windows x64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: gui-win-release
          cache-all-crates: "true"

      - name: Build GPUI GUI Windows
        shell: pwsh
        run: |
          cargo build --release -p dscan-gui
          mkdir -p release-gui-win
          Copy-Item target/release/dscan-gui.exe release-gui-win/
          Compress-Archive -Path release-gui-win/dscan-gui.exe -DestinationPath dscan-gui-windows-x64.zip
          $hash = (Get-FileHash -Path dscan-gui-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  dscan-gui-windows-x64.zip" | Out-File -FilePath "dscan-gui-windows-x64.zip.sha256" -Encoding ascii

      - name: Upload Windows GUI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dscan-gui-windows-x64.zip
          path: |
            dscan-gui-windows-x64.zip
            dscan-gui-windows-x64.zip.sha256

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-cli, build-gui-linux, build-gui-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble Release Assets and Checksums
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} dist-release/ \;
          find release-artifacts -type f -name "*.sha256" -exec cat {} + > dist-release/SHA256SUMS.txt
          cat dist-release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
