name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  build-cli:
    name: Build CLI (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: dscan
            asset_name: dscan-linux-x86_64.tar.gz
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            bin_name: dscan
            asset_name: dscan-linux-aarch64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: dscan.exe
            asset_name: dscan-windows-x64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Mold Linker
        if: matrix.os == 'ubuntu-latest' && matrix.target != 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Install aarch64 cross-linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-all-crates: "true"

      - name: Build dscan CLI (Linux x86_64 with Mold)
        if: matrix.os == 'ubuntu-latest' && matrix.target == 'x86_64-unknown-linux-gnu'
        run: mold -run cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Build dscan CLI (Linux aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Build dscan CLI (Windows x64)
        if: matrix.os == 'windows-latest'
        run: cargo build --release -p dscan --target ${{ matrix.target }}

      - name: Package Linux artifact
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ../../../${{ matrix.asset_name }} ${{ matrix.bin_name }}
          cd ../../..
          sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Package Windows artifact
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -Destination ${{ matrix.bin_name }}
          Compress-Archive -Path target/${{ matrix.target }}/release/${{ matrix.bin_name }} -DestinationPath ${{ matrix.asset_name }}
          $hashExe = (Get-FileHash -Path ${{ matrix.bin_name }} -Algorithm SHA256).Hash.ToLower()
          "$hashExe  ${{ matrix.bin_name }}" | Out-File -FilePath "${{ matrix.bin_name }}.sha256" -Encoding ascii
          $hashZip = (Get-FileHash -Path ${{ matrix.asset_name }} -Algorithm SHA256).Hash.ToLower()
          "$hashZip  ${{ matrix.asset_name }}" | Out-File -FilePath "${{ matrix.asset_name }}.sha256" -Encoding ascii

      - name: Upload CLI Artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

      - name: Upload CLI Artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-cli-artifacts
          path: |
            ${{ matrix.bin_name }}
            ${{ matrix.bin_name }}.sha256
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256

  build-desktop:
    name: Build Desktop Visualizer & Distro Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain and zstd
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd fakeroot dpkg

      - name: Build Linux JNI and CLI binaries
        run: |
          cargo build --release -p dscan-jni
          cargo build --release -p dscan
          mkdir -p android/desktopApp/src/jvmMain/resources
          cp target/release/libdscan.so android/desktopApp/src/jvmMain/resources/

      - name: Build Compose Desktop Distributable and UberJar
        run: |
          cd android
          ./gradlew :desktopApp:packageUberJarForCurrentOS :desktopApp:createDistributable
          cp desktopApp/build/compose/jars/*.jar ../dscan-desktop.jar
          cd ..
          tar -czf dscan-desktop-linux-x64.tar.gz -C android/desktopApp/build/compose/binaries/main/app dscan

      - name: Build Debian Package
        run: |
          cd android
          ./gradlew :desktopApp:packageDeb || true
          cd ..
          if [ -d android/desktopApp/build/compose/binaries/main/deb ]; then
            cp android/desktopApp/build/compose/binaries/main/deb/*.deb dscan-desktop.deb || true
          fi

      - name: Build Arch Linux Package (.pkg.tar.zst)
        run: |
          mkdir -p arch_pkg/usr/bin arch_pkg/opt arch_pkg/usr/share/applications arch_pkg/usr/share/pixmaps
          cp target/release/dscan arch_pkg/usr/bin/dscan
          cp -r android/desktopApp/build/compose/binaries/main/app/dscan arch_pkg/opt/
          ln -sf /opt/dscan/bin/dscan arch_pkg/usr/bin/dscan-desktop
          cp assets/dscan.desktop arch_pkg/usr/share/applications/dscan.desktop
          if [ -f android/desktopApp/build/compose/binaries/main/app/dscan/lib/dscan.png ]; then
            cp android/desktopApp/build/compose/binaries/main/app/dscan/lib/dscan.png arch_pkg/usr/share/pixmaps/dscan.png
          fi
          INSTALLED_SIZE=$(du -sb arch_pkg | cut -f1)
          BUILD_DATE=$(date +%s)
          cat << EOF > arch_pkg/.PKGINFO
          # Generated by dscan packaging
          pkgname = dscan
          pkgver = 0.8.1-1
          pkgdesc = Extreme-performance disk space analyzer and Compose Multiplatform visualizer
          url = https://github.com/AhooraZen/dscan
          builddate = $BUILD_DATE
          packager = AhooraZen <ahoora935137@gmail.com>
          size = $INSTALLED_SIZE
          arch = x86_64
          license = MIT
          license = Apache-2.0
          provides = dscan
          provides = dscan-desktop
          EOF
          (cd arch_pkg && tar --format=posix -c .PKGINFO usr opt | zstd -3 -T0 -o ../dscan-0.8.1-1-x86_64.pkg.tar.zst)

      - name: Compute Checksums
        run: |
          sha256sum dscan-desktop.jar > dscan-desktop.jar.sha256
          sha256sum dscan-desktop-linux-x64.tar.gz > dscan-desktop-linux-x64.tar.gz.sha256
          sha256sum dscan-0.8.1-1-x86_64.pkg.tar.zst > dscan-0.8.1-1-x86_64.pkg.tar.zst.sha256
          if [ -f dscan-desktop.deb ]; then
            sha256sum dscan-desktop.deb > dscan-desktop.deb.sha256
          fi

      - name: Upload Desktop and Distro Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-distro-artifacts
          path: |
            dscan-desktop.jar*
            dscan-desktop-linux-x64.tar.gz*
            dscan-0.8.1-1-x86_64.pkg.tar.zst*
            dscan-desktop.deb*

  build-desktop-windows:
    name: Build Desktop Windows (MSI & Standalone GUI Zip)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Windows JNI dll
        run: |
          cargo build --release -p dscan-jni
          New-Item -ItemType Directory -Force -Path android/desktopApp/src/jvmMain/resources
          Copy-Item target/release/dscan.dll android/desktopApp/src/jvmMain/resources/

      - name: Build Desktop Distributable and MSI
        run: |
          cd android
          ./gradlew :desktopApp:createDistributable :desktopApp:packageMsi
          cd ..
          Compress-Archive -Path android/desktopApp/build/compose/binaries/main/app/dscan -DestinationPath dscan-desktop-windows-x64.zip
          if (Test-Path android/desktopApp/build/compose/binaries/main/msi/*.msi) {
            Copy-Item android/desktopApp/build/compose/binaries/main/msi/*.msi dscan-desktop.msi
          }
          $hashZip = (Get-FileHash -Path dscan-desktop-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hashZip  dscan-desktop-windows-x64.zip" | Out-File -FilePath "dscan-desktop-windows-x64.zip.sha256" -Encoding ascii
          if (Test-Path dscan-desktop.msi) {
            $hashMsi = (Get-FileHash -Path dscan-desktop.msi -Algorithm SHA256).Hash.ToLower()
            "$hashMsi  dscan-desktop.msi" | Out-File -FilePath "dscan-desktop.msi.sha256" -Encoding ascii
          }

      - name: Upload Windows Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-artifacts
          path: |
            dscan-desktop-windows-x64.zip*
            dscan-desktop.msi*

  build-android:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Rust JNI cdylibs
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/$(ls -1 $ANDROID_HOME/ndk 2>/dev/null | tail -n 1)}"
          cargo ndk -t arm64-v8a -t x86_64 -t armeabi-v7a -o android/androidApp/src/main/jniLibs build --release -p dscan-jni

      - name: Build Android Release APK
        run: |
          cd android
          ./gradlew :androidApp:assembleRelease
          cp androidApp/build/outputs/apk/release/androidApp-release.apk ../dscan-android-release.apk
          cd ..
          sha256sum dscan-android-release.apk > dscan-android-release.apk.sha256

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dscan-android-release.apk
          path: |
            dscan-android-release.apk
            dscan-android-release.apk.sha256

  publish-crates-io:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Publish dscan-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dscan-core || true

      - name: Wait for index propagation
        run: sleep 20

      - name: Publish dscan CLI
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p dscan || true

  publish-github-release:
    name: Publish GitHub Release
    needs: [build-cli, build-desktop, build-desktop-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Assemble Release Assets and Checksums
        run: |
          mkdir -p dist-release
          find release-artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.apk" -o -name "*.jar" -o -name "*.deb" -o -name "*.pkg.tar.zst" -o -name "*.exe" -o -name "*.msi" \) -exec cp {} dist-release/ \;
          find release-artifacts -type f -name "*.sha256" -exec cat {} + > dist-release/SHA256SUMS.txt
          cat dist-release/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
