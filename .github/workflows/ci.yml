name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-all-crates: "true"

      - name: Format Check
        run: cargo fmt --check

      - name: Clippy (Workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test-linux:
    name: Test Linux (Workspace)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Mold Linker
        run: sudo apt-get update && sudo apt-get install -y mold clang

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: linux-test
          cache-all-crates: "true"

      - name: Run Tests (with Mold)
        run: mold -run cargo test --workspace

  test-windows:
    name: Test Windows (Workspace)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: win-test
          cache-all-crates: "true"

      - name: Run Windows Workspace Tests
        run: cargo test --workspace

  build-desktop-compose:
    name: Build Compose Desktop App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Desktop App
        run: |
          cd android
          ./gradlew :desktopApp:assemble

  build-android-compose:
    name: Build Compose Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble Android Debug APK
        run: |
          cd android
          ./gradlew :androidApp:assembleDebug
